<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Offline · Figbolt</title>
<!--
  Served by the service worker when a page cannot be reached. It must render
  with no network at all, so everything is inline: no fonts, no stylesheet, no
  framework chunks. It deliberately shows no customer data — nothing from the
  CRM is cached on the device, so a lost or shared phone holds none of it.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: oklch(99.2% 0.001 250);
    --surface: oklch(100% 0 0);
    --border: oklch(91.5% 0.004 250);
    --text: oklch(21% 0.008 260);
    --text-muted: oklch(46% 0.008 258);
    --accent: oklch(52% 0.19 268);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: oklch(17.5% 0.008 265);
      --surface: oklch(21% 0.009 265);
      --border: oklch(29% 0.011 265);
      --text: oklch(96% 0.003 265);
      --text-muted: oklch(72% 0.008 265);
      --accent: oklch(68% 0.16 268);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .mark {
    width: 48px; height: 48px; margin: 0 auto 20px;
    border-radius: 13px;
    background: linear-gradient(145deg, #4a63e0 0%, #3b4fc8 55%, #5b3fc4 100%);
    display: grid; place-items: center;
  }
  .mark svg { width: 31px; height: 31px; }
  h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  p { margin: 0 0 24px; color: var(--text-muted); text-wrap: pretty; }
  a.retry {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 44px; padding: 0 22px;
    border-radius: 10px; background: var(--accent); color: #fff;
    font-weight: 500; text-decoration: none;
  }
  a.retry:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 32 32" fill="#fff"><path fill-rule="evenodd" d="M15.5 5a12.5 12.5 0 1 0 0 25a12.5 12.5 0 1 0 0-25zM18.3 3.4L8.9 19h6.2l-2 12.6L22.5 16h-6.2z"/><path d="M20.6 7.9c.1-3.2 2.6-5.5 6.9-5.4c-.2 3.7-3 5.9-6.9 5.4z"/></svg>
  </div>
  <h1>You're offline</h1>
  <p>Figbolt needs a connection to show your customers. Nothing from your workspace is stored on this device, so it will load as soon as you're back online.</p>
  <!-- An empty href reloads whatever page the visitor was trying to open. -->
  <a class="retry" href="">Try again</a>
</main>
<script>
  // Come back on our own when the connection does.
  addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
